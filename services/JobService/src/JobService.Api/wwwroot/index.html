<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Engine — Demo Control Panel</title>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --border: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
            --green: #22c55e; --red: #ef4444; --yellow: #eab308; --orange: #f97316;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 1rem; }
        h1 { font-size: 1.25rem; margin-bottom: 1rem; }
        h2 { font-size: 1rem; color: var(--muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; }

        .stats { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .stat { text-align: center; flex: 1; min-width: 60px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }

        .stat-pending .stat-value { color: var(--yellow); }
        .stat-running .stat-value { color: var(--accent); }
        .stat-retrying .stat-value { color: var(--orange); }
        .stat-completed .stat-value { color: var(--green); }
        .stat-failed .stat-value { color: var(--red); }
        .stat-cancelled .stat-value { color: var(--muted); }

        label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
        select, input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.6rem; border-radius: 0.25rem; width: 100%; font-size: 0.85rem; }
        .row { display: flex; gap: 0.5rem; align-items: end; margin-bottom: 0.5rem; }
        .row > * { flex: 1; }

        button { background: var(--accent); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.25rem; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
        button:hover { opacity: 0.9; }
        button.danger { background: var(--red); }
        button.warn { background: var(--orange); }
        button.success { background: var(--green); }
        button.small { padding: 0.3rem 0.6rem; font-size: 0.75rem; }

        .chaos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .chaos-btn { text-align: left; padding: 0.4rem 0.6rem; font-size: 0.75rem; }

        .jobs-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .jobs-table th, .jobs-table td { padding: 0.3rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
        .jobs-table th { color: var(--muted); font-weight: 500; }

        .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 0.2rem; font-size: 0.7rem; font-weight: 600; }
        .badge-pending { background: #422006; color: var(--yellow); }
        .badge-running { background: #172554; color: var(--accent); }
        .badge-retrying { background: #431407; color: var(--orange); }
        .badge-completed { background: #052e16; color: var(--green); }
        .badge-failed { background: #450a0a; color: var(--red); }
        .badge-cancelled { background: #1e293b; color: var(--muted); }

        .copy-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 0.1rem 0.3rem; font-size: 0.65rem; cursor: pointer; border-radius: 0.2rem; margin-left: 0.25rem; }
        .copy-btn:hover { color: var(--text); border-color: var(--text); }
        .copy-btn.copied { color: var(--green); border-color: var(--green); }

        .log { background: var(--bg); border: 1px solid var(--border); border-radius: 0.25rem; padding: 0.5rem; font-family: monospace; font-size: 0.75rem; height: 120px; overflow-y: auto; color: var(--muted); }
        .log-entry { margin-bottom: 0.15rem; }
        .log-time { color: var(--border); }

        .active-policies { list-style: none; }
        .active-policies li { display: flex; justify-content: space-between; align-items: center; padding: 0.25rem 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
        .active-policies .name { color: var(--red); font-weight: 600; }

        #status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.4rem; }
        .connected { background: var(--green); }
        .disconnected { background: var(--red); }
    </style>
</head>
<body>
    <h1><span id="status-indicator" class="disconnected"></span>Distributed Job Engine — Demo Control Panel</h1>

    <h2>Job Summary</h2>
    <div class="card" style="margin-bottom: 1.5rem;">
        <div class="stats" id="summary-stats">
            <div class="stat stat-pending"><div class="stat-value" id="count-pending">-</div><div class="stat-label">Pending</div></div>
            <div class="stat stat-running"><div class="stat-value" id="count-running">-</div><div class="stat-label">Running</div></div>
            <div class="stat stat-retrying"><div class="stat-value" id="count-retrying">-</div><div class="stat-label">Retrying</div></div>
            <div class="stat stat-completed"><div class="stat-value" id="count-completed">-</div><div class="stat-label">Completed</div></div>
            <div class="stat stat-failed"><div class="stat-value" id="count-failed">-</div><div class="stat-label">Failed</div></div>
            <div class="stat stat-cancelled"><div class="stat-value" id="count-cancelled">-</div><div class="stat-label">Cancelled</div></div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Submit Job</h2>
            <div class="row">
                <div>
                    <label>Type</label>
                    <select id="job-type" onchange="updatePayloadFields()">
                        <option value="generate-report">generate-report</option>
                        <option value="data-export">data-export</option>
                        <option value="always-fail">always-fail</option>
                        <option value="fail-n-times">fail-n-times</option>
                        <option value="slow-job">slow-job</option>
                    </select>
                </div>
                <div>
                    <label>Max Attempts</label>
                    <input type="number" id="max-attempts" value="3" min="1" max="10" />
                </div>
            </div>
            <div id="payload-fields"></div>
            <div class="row">
                <button onclick="submitJob()">Submit Single</button>
                <div style="display:flex; gap:0.3rem; align-items:end;">
                    <div><label>Count</label><input type="number" id="bulk-count" value="10" min="1" max="1000" style="width:70px" /></div>
                    <button onclick="submitBulk()">Submit Bulk</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Chaos — JobService</h2>
            <div class="chaos-grid">
                <button class="danger chaos-btn" onclick="chaos('jobservice', 'crash-after-commit')">Crash After Commit</button>
                <button class="warn chaos-btn" onclick="chaos('jobservice', 'pause-outbox')">Pause Outbox</button>
                <button class="success chaos-btn" onclick="chaos('jobservice', 'resume-outbox')">Resume Outbox</button>
                <button class="warn chaos-btn" onclick="chaosWithParam('jobservice', 'delay-outbox', 'delayMs', 5000)">Delay Outbox 5s</button>
                <button class="danger chaos-btn" onclick="chaos('jobservice', 'force-publish-failure')">Force Publish Fail</button>
                <button class="small" onclick="clearAllChaos('jobservice')">Clear All</button>
            </div>
        </div>

        <div class="card">
            <h2>Chaos — WorkerService</h2>
            <div class="chaos-grid">
                <button class="danger chaos-btn" onclick="chaos('workerservice', 'crash-after-claim')">Crash After Claim</button>
                <button class="danger chaos-btn" onclick="chaos('workerservice', 'crash-after-effect')">Crash After Effect</button>
                <button class="danger chaos-btn" onclick="chaos('workerservice', 'fail-next-job')">Fail Next Job</button>
                <button class="warn chaos-btn" onclick="chaosWithParam('workerservice', 'delay-execution', 'delayMs', 10000)">Delay Exec 10s</button>
                <button class="danger chaos-btn" onclick="chaos('workerservice', 'stop-heartbeat')">Stop Heartbeat</button>
                <button class="warn chaos-btn" onclick="failJobType()">Fail Job Type</button>
                <button class="small" onclick="clearAllChaos('workerservice')">Clear All</button>
            </div>
        </div>

        <div class="card">
            <h2>Active Chaos Policies</h2>
            <ul class="active-policies" id="chaos-list">
                <li style="color: var(--muted); font-size: 0.8rem;">No active policies</li>
            </ul>
        </div>
    </div>

    <h2>Recent Jobs</h2>
    <div class="card" style="margin-bottom: 1.5rem; overflow-x: auto;">
        <table class="jobs-table">
            <thead>
                <tr><th>ID</th><th>Type</th><th>State</th><th>Attempt</th><th>Created</th><th>Actions</th></tr>
            </thead>
            <tbody id="jobs-body">
                <tr><td colspan="6" style="color: var(--muted);">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <h2>Event Log</h2>
    <div class="log" id="event-log"></div>

    <script>
        const JOB_API = window.location.origin;
        const WORKER_PORTS = [5101, 5102, 5103];
        const WORKER_APIS = WORKER_PORTS.map(p => `http://localhost:${p}`);

        function log(msg) {
            const el = document.getElementById('event-log');
            const time = new Date().toLocaleTimeString();
            el.innerHTML = `<div class="log-entry"><span class="log-time">${time}</span> ${msg}</div>` + el.innerHTML;
            if (el.children.length > 200) el.removeChild(el.lastChild);
        }

        async function api(method, url, body) {
            try {
                const opts = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) opts.body = JSON.stringify(body);
                const res = await fetch(url, opts);
                const data = res.ok ? await res.json().catch(() => null) : null;
                return { ok: res.ok, status: res.status, data };
            } catch (e) {
                return { ok: false, status: 0, data: null, error: e.message };
            }
        }

        const JOB_TYPE_CONFIG = {
            'generate-report': { description: 'Generates a report (~2s)', fields: [] },
            'data-export': { description: 'Exports data as JSON (~3s)', fields: [] },
            'always-fail': { description: 'Always throws an error', fields: [] },
            'fail-n-times': {
                description: 'Fails N times, then succeeds',
                fields: [{ id: 'failCount', label: 'Fail Count', type: 'number', default: 3, min: 1, max: 10 }]
            },
            'slow-job': {
                description: 'Delays execution for a duration',
                fields: [{ id: 'delaySeconds', label: 'Delay (seconds)', type: 'number', default: 30, min: 1, max: 120 }]
            }
        };

        function updatePayloadFields() {
            const type = document.getElementById('job-type').value;
            const config = JOB_TYPE_CONFIG[type];
            const container = document.getElementById('payload-fields');

            if (!config || config.fields.length === 0) {
                container.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);padding:0.25rem 0;">${config?.description || 'No configuration needed'}</div>`;
                return;
            }

            container.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);margin-bottom:0.25rem;">${config.description}</div>` +
                '<div class="row">' + config.fields.map(f =>
                    `<div><label>${f.label}</label><input type="${f.type}" id="payload-${f.id}" value="${f.default}" min="${f.min}" max="${f.max}" /></div>`
                ).join('') + '</div>';
        }

        function buildPayload() {
            const type = document.getElementById('job-type').value;
            const config = JOB_TYPE_CONFIG[type];
            if (!config || config.fields.length === 0) return '{}';
            const obj = {};
            for (const f of config.fields) {
                const el = document.getElementById(`payload-${f.id}`);
                if (el) obj[f.id] = f.type === 'number' ? parseInt(el.value) : el.value;
            }
            return JSON.stringify(obj);
        }

        async function failJobType() {
            const jobType = document.getElementById('job-type').value;
            const count = parseInt(document.getElementById('max-attempts').value) || 3;
            const results = await Promise.all(WORKER_APIS.map(url =>
                api('POST', `${url}/demo/failures/fail-job-type?jobType=${jobType}&count=${count}`)));
            const ok = results.filter(r => r.ok).length;
            log(ok > 0
                ? `<span style="color:var(--red)">[CHAOS]</span> fail-job-type for "${jobType}" (${count}x) on ${ok}/${WORKER_APIS.length} workers`
                : `Failed to activate fail-job-type on any worker`);
        }

        function copyId(btn, id) {
            navigator.clipboard.writeText(id).then(() => {
                btn.textContent = 'Copied';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            });
        }

        async function submitJob() {
            const type = document.getElementById('job-type').value;
            const maxAttempts = parseInt(document.getElementById('max-attempts').value);
            const payloadJson = buildPayload();
            const result = await api('POST', `${JOB_API}/jobs`, { type, payloadJson, maxAttempts });
            if (result.ok) {
                log(`<span style="color:var(--green)">Created job ${result.data}</span> [${type}] ${payloadJson !== '{}' ? payloadJson : ''}`);
            } else {
                log(`<span style="color:var(--red)">Failed to create job: ${result.status}</span>`);
            }
        }

        async function submitBulk() {
            const count = parseInt(document.getElementById('bulk-count').value);
            const type = document.getElementById('job-type').value;
            const maxAttempts = parseInt(document.getElementById('max-attempts').value);
            const payloadJson = buildPayload();
            log(`Submitting ${count} jobs of type [${type}]...`);
            let ok = 0, fail = 0;
            const promises = [];
            for (let i = 0; i < count; i++) {
                promises.push(api('POST', `${JOB_API}/jobs`, { type, payloadJson, maxAttempts }).then(r => r.ok ? ok++ : fail++));
            }
            await Promise.all(promises);
            log(`Bulk complete: <span style="color:var(--green)">${ok} created</span>, <span style="color:var(--red)">${fail} failed</span>`);
        }

        async function cancelJob(jobId) {
            const result = await api('POST', `${JOB_API}/jobs/${jobId}/cancel`);
            log(result.ok ? `Cancelled job ${jobId.substring(0, 8)}...` : `Failed to cancel: ${result.status}`);
        }

        async function retryJob(jobId) {
            const result = await api('POST', `${JOB_API}/jobs/${jobId}/retry`);
            log(result.ok ? `Retried job ${jobId.substring(0, 8)}...` : `Failed to retry: ${result.status}`);
        }

        async function chaos(service, policy) {
            if (service === 'jobservice') {
                const result = await api('POST', `${JOB_API}/demo/failures/${policy}`);
                log(result.ok
                    ? `<span style="color:var(--red)">[CHAOS]</span> Activated ${policy} on jobservice`
                    : `Failed to activate ${policy}: ${result.status}`);
            } else {
                const results = await Promise.all(WORKER_APIS.map(url => api('POST', `${url}/demo/failures/${policy}`)));
                const ok = results.filter(r => r.ok).length;
                log(ok > 0
                    ? `<span style="color:var(--red)">[CHAOS]</span> Activated ${policy} on ${ok}/${WORKER_APIS.length} workers`
                    : `Failed to activate ${policy} on any worker`);
            }
        }

        async function chaosWithParam(service, policy, param, value) {
            if (service === 'jobservice') {
                const result = await api('POST', `${JOB_API}/demo/failures/${policy}?${param}=${value}`);
                log(result.ok
                    ? `<span style="color:var(--red)">[CHAOS]</span> Activated ${policy} (${param}=${value}) on jobservice`
                    : `Failed to activate ${policy}: ${result.status}`);
            } else {
                const results = await Promise.all(WORKER_APIS.map(url => api('POST', `${url}/demo/failures/${policy}?${param}=${value}`)));
                const ok = results.filter(r => r.ok).length;
                log(ok > 0
                    ? `<span style="color:var(--red)">[CHAOS]</span> Activated ${policy} (${param}=${value}) on ${ok}/${WORKER_APIS.length} workers`
                    : `Failed to activate ${policy} on any worker`);
            }
        }

        async function deactivateChaos(service, policy) {
            if (service === 'jobservice') {
                await api('DELETE', `${JOB_API}/demo/failures/${policy}`);
                log(`<span style="color:var(--green)">[CHAOS]</span> Deactivated ${policy} on jobservice`);
            } else {
                await Promise.all(WORKER_APIS.map(url => api('DELETE', `${url}/demo/failures/${policy}`)));
                log(`<span style="color:var(--green)">[CHAOS]</span> Deactivated ${policy} on all workers`);
            }
        }

        async function clearAllChaos(service) {
            if (service === 'jobservice') {
                const result = await api('GET', `${JOB_API}/demo/failures`);
                if (result.ok && result.data) {
                    for (const p of result.data) await api('DELETE', `${JOB_API}/demo/failures/${p.name}`);
                    log(`<span style="color:var(--green)">[CHAOS]</span> Cleared all policies on jobservice`);
                }
            } else {
                await Promise.all(WORKER_APIS.map(async url => {
                    const result = await api('GET', `${url}/demo/failures`);
                    if (result.ok && result.data) {
                        for (const p of result.data) await api('DELETE', `${url}/demo/failures/${p.name}`);
                    }
                }));
                log(`<span style="color:var(--green)">[CHAOS]</span> Cleared all policies on all workers`);
            }
        }

        async function refreshSummary() {
            const result = await api('GET', `${JOB_API}/jobs/summary`);
            const indicator = document.getElementById('status-indicator');
            if (result.ok && result.data) {
                indicator.className = 'connected';
                const states = ['Pending', 'Running', 'Retrying', 'Completed', 'Failed', 'Cancelled'];
                for (const s of states) {
                    const el = document.getElementById(`count-${s.toLowerCase()}`);
                    el.textContent = result.data[s] || 0;
                }
            } else {
                indicator.className = 'disconnected';
            }
        }

        async function refreshJobs() {
            const result = await api('GET', `${JOB_API}/jobs?pageSize=20&page=1`);
            const tbody = document.getElementById('jobs-body');
            if (result.ok && result.data && result.data.length > 0) {
                tbody.innerHTML = result.data.map(j => `
                    <tr>
                        <td style="font-family:monospace;font-size:0.75rem;white-space:nowrap">
                            ${j.id.substring(0, 8)}<button class="copy-btn" onclick="copyId(this, '${j.id}')" title="${j.id}">Copy</button>
                        </td>
                        <td>${j.type}</td>
                        <td><span class="badge badge-${j.state.toLowerCase()}">${j.state}</span></td>
                        <td>${j.attemptCount || 0}/${j.maxAttempts}</td>
                        <td style="font-size:0.75rem">${new Date(j.createdAt).toLocaleTimeString()}</td>
                        <td>
                            ${['Pending', 'Running'].includes(j.state) ? `<button class="small danger" onclick="cancelJob('${j.id}')">Cancel</button>` : ''}
                            ${j.state === 'Failed' ? `<button class="small warn" onclick="retryJob('${j.id}')">Retry</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } else if (result.ok) {
                tbody.innerHTML = '<tr><td colspan="6" style="color: var(--muted);">No jobs yet</td></tr>';
            }
        }

        async function refreshChaos() {
            const list = document.getElementById('chaos-list');
            const policies = [];

            const js = await api('GET', `${JOB_API}/demo/failures`);
            if (js.ok && js.data) {
                for (const p of js.data) policies.push({ ...p, service: 'jobservice' });
            }

            const workerPolicies = new Map();
            for (let i = 0; i < WORKER_APIS.length; i++) {
                const ws = await api('GET', `${WORKER_APIS[i]}/demo/failures`);
                if (ws.ok && ws.data) {
                    for (const p of ws.data) {
                        if (!workerPolicies.has(p.name)) workerPolicies.set(p.name, { ...p, ports: [] });
                        workerPolicies.get(p.name).ports.push(WORKER_PORTS[i]);
                    }
                }
            }
            for (const [, p] of workerPolicies) {
                policies.push({ ...p, service: 'workerservice', portLabel: `${p.ports.length}/${WORKER_PORTS.length} workers` });
            }

            if (policies.length === 0) {
                list.innerHTML = '<li style="color: var(--muted); font-size: 0.8rem;">No active policies</li>';
            } else {
                list.innerHTML = policies.map(p => `
                    <li>
                        <span><span class="name">${p.name}</span> <span style="color:var(--muted);font-size:0.7rem">(${p.portLabel || p.service})</span></span>
                        <button class="small" onclick="deactivateChaos('${p.service}', '${p.name}')">Deactivate</button>
                    </li>
                `).join('');
            }
        }

        async function refresh() {
            await Promise.all([refreshSummary(), refreshJobs(), refreshChaos()]);
        }

        updatePayloadFields();
        refresh();
        setInterval(refresh, 2000);
    </script>
</body>
</html>
